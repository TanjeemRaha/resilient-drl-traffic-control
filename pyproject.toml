[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resilient-drl-traffic-control"
version = "0.1.0"
description = "Synthetic proof-of-concept for resilient adaptive traffic signal control"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.1,<3", "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1", "PyYAML>=6,<7", "gymnasium>=0.29,<2",
  "stable-baselines3>=2.3,<3", "torch>=2.1,<2.6", "tensorboard>=2.15,<3",
  "scipy>=1.11,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
